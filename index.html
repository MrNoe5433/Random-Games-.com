<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131c;
      color: #f4f6ff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(900px, 94vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: 0.18em;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 12px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .label {
      color: #aab2c8;
      font-size: 0.9rem;
      font-weight: 500;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 8 / 5;
      border: 2px solid #343b50;
      border-radius: 8px;
      background: #171c29;
      cursor: none;
      touch-action: none;
    }

    p {
      color: #aab2c8;
      font-size: 0.95rem;
    }

    button {
      padding: 8px 16px;
      border: 1px solid #596580;
      border-radius: 6px;
      background: #252c3d;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #323b50; }
  </style>
</head>
<body>
  <main>
    <h1>PONG</h1>
    <div class="scoreboard" aria-live="polite">
      <div><span class="label">YOU</span> <span id="playerScore">0</span></div>
      <span aria-hidden="true">:</span>
      <div><span class="label">COMPUTER</span> <span id="computerScore">0</span></div>
    </div>

    <canvas id="game" width="800" height="500" aria-label="Pong game"></canvas>
    <p>Move with your mouse or ↑ / ↓ arrow keys.</p>
    <button id="restart" type="button">Restart game</button>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 90;
    const PADDLE_SPEED = 7;

    const player = { x: 28, y: (HEIGHT - PADDLE_HEIGHT) / 2 };
    const computer = { x: WIDTH - 28 - PADDLE_WIDTH, y: (HEIGHT - PADDLE_HEIGHT) / 2 };
    const ball = { x: WIDTH / 2, y: HEIGHT / 2, radius: 9, vx: 5, vy: 3 };

    let playerScore = 0;
    let computerScore = 0;
    const keys = { up: false, down: false };

    function serve(direction) {
      ball.x = WIDTH / 2;
      ball.y = HEIGHT / 2;
      ball.vx = 5 * direction;
      ball.vy = (Math.random() * 4 - 2) || 1;
    }

    function movePlayer() {
      if (keys.up) player.y -= PADDLE_SPEED;
      if (keys.down) player.y += PADDLE_SPEED;
      player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y));
    }

    function moveComputer() {
      const target = ball.y - PADDLE_HEIGHT / 2;
      const difference = target - computer.y;
      computer.y += Math.max(-4.5, Math.min(4.5, difference));
      computer.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, computer.y));
    }

    function collidesWithPaddle(paddle) {
      return ball.x + ball.radius > paddle.x &&
        ball.x - ball.radius < paddle.x + PADDLE_WIDTH &&
        ball.y + ball.radius > paddle.y &&
        ball.y - ball.radius < paddle.y + PADDLE_HEIGHT;
    }

    function update() {
      movePlayer();
      moveComputer();

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce off the top and bottom walls.
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= HEIGHT) {
        ball.vy *= -1;
        ball.y = Math.max(ball.radius, Math.min(HEIGHT - ball.radius, ball.y));
      }

      // Bounce off paddles and add a little angle based on the hit position.
      if (ball.vx < 0 && collidesWithPaddle(player)) {
        const hit = (ball.y - (player.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ball.vx = Math.abs(ball.vx) * 1.04;
        ball.vy = hit * 5;
        ball.x = player.x + PADDLE_WIDTH + ball.radius;
      } else if (ball.vx > 0 && collidesWithPaddle(computer)) {
        const hit = (ball.y - (computer.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ball.vx = -Math.abs(ball.vx) * 1.04;
        ball.vy = hit * 5;
        ball.x = computer.x - ball.radius;
      }

      // Award a point and serve toward the player who conceded.
      if (ball.x + ball.radius < 0) {
        computerScore++;
        computerScoreEl.textContent = computerScore;
        serve(1);
      } else if (ball.x - ball.radius > WIDTH) {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        serve(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Dashed center line.
      ctx.strokeStyle = "#343b50";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 0);
      ctx.lineTo(WIDTH / 2, HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#f4f6ff";
      ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
      ctx.fillRect(computer.x, computer.y, PADDLE_WIDTH, PADDLE_HEIGHT);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function setPlayerFromPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = HEIGHT / rect.height;
      player.y = (event.clientY - rect.top) * scaleY - PADDLE_HEIGHT / 2;
      player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y));
    }

    canvas.addEventListener("pointermove", setPlayerFromPointer);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        keys.up = true;
        event.preventDefault();
      } else if (event.key === "ArrowDown") {
        keys.down = true;
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") keys.up = false;
      if (event.key === "ArrowDown") keys.down = false;
    });

    document.getElementById("restart").addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      playerScoreEl.textContent = "0";
      computerScoreEl.textContent = "0";
      player.y = (HEIGHT - PADDLE_HEIGHT) / 2;
      computer.y = (HEIGHT - PADDLE_HEIGHT) / 2;
      serve(Math.random() < 0.5 ? -1 : 1);
    });

    serve(Math.random() < 0.5 ? -1 : 1);
    gameLoop();
  </script>
</body>
</html>
